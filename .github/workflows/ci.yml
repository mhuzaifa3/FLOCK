name: CI

# Runs on main, and on demand from ci-command.yml when a maintainer comments
# "/ci" on a pull request. There is deliberately no `pull_request` trigger:
# an unreviewed contribution must not be able to execute anything here.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out. Defaults to the triggering ref.
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The checked-out tree may be an unmerged contribution, so the job
          # must not carry a credential it could exfiltrate.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
